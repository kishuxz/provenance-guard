name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Test
        run: pnpm test --reporter=default --reporter=json --outputFile=test-results.json

      # docs/PRODUCT_SPEC.md requires CI to publish benchmark and test
      # evidence. A log that expires is not published evidence.
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: test-results
          path: test-results.json
          if-no-files-found: error

  bench:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Bench
        run: pnpm exec provguard bench --json | tee bench-table.txt

      - name: Performance measurement
        run: pnpm perf --json | tee perf-table.txt

      - name: Upload benchmark and performance evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: bench-results
          path: |
            bench-results.json
            bench-table.txt
            perf-results.json
            perf-table.txt
          if-no-files-found: error

  # The Neo4j adapter's tests skip when no database is reachable, so `verify`
  # stays green on a machine without Docker and the offline core requirement
  # holds. A skipped test is not evidence, so they are also run here against a
  # real instance -- otherwise "integration-tested" would only mean "compiled".
  neo4j:
    runs-on: ubuntu-latest
    needs: verify
    services:
      neo4j:
        image: neo4j:5-community
        ports:
          - 7687:7687
          - 7474:7474
        env:
          NEO4J_AUTH: neo4j/provguardtest
          NEO4J_server_memory_heap_max__size: 512M
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Neo4j integration tests
        env:
          PROVGUARD_NEO4J_URI: bolt://localhost:7687
          PROVGUARD_NEO4J_USER: neo4j
          PROVGUARD_NEO4J_PASSWORD: provguardtest
        run: pnpm exec vitest run packages/neo4j

      - name: Fail if the integration tests silently skipped
        env:
          PROVGUARD_NEO4J_URI: bolt://localhost:7687
          PROVGUARD_NEO4J_USER: neo4j
          PROVGUARD_NEO4J_PASSWORD: provguardtest
        # A green job that ran zero assertions is the failure mode this whole
        # job exists to prevent, so assert the suite actually executed.
        run: |
          pnpm exec vitest run packages/neo4j --reporter=json --outputFile=/tmp/neo4j.json
          node -e '
            const r = require("/tmp/neo4j.json");
            if (r.numTotalTests === 0 || r.numPassedTests === 0) {
              console.error("neo4j integration suite ran no tests");
              process.exit(1);
            }
            console.log(`neo4j integration suite: ${r.numPassedTests}/${r.numTotalTests} passed`);
          '
